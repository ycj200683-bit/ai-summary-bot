<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 摘要服务</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1a1a1a; line-height: 1.6;
    min-height: 100vh; padding: 28px 16px 56px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; }
  h1 span { color: #4f46e5; }
  .sub { color: #6b7280; font-size: 14px; margin-top: 5px; }

  .stats {
    display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .stat {
    flex: 1 1 140px; background: #fff; border: 1px solid #e5e7eb;
    border-radius: 11px; padding: 11px 14px;
  }
  .stat .k { font-size: 12px; color: #9ca3af; }
  .stat .v {
    font-size: 19px; font-weight: 700; color: #111827;
    font-variant-numeric: tabular-nums; margin-top: 1px;
  }

  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  textarea {
    width: 100%; min-height: 170px; padding: 14px; font-size: 15px;
    font-family: inherit; line-height: 1.7; color: #111827;
    border: 1px solid #d1d5db; border-radius: 10px; resize: vertical;
    outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .count { font-size: 13px; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .count.over { color: #dc2626; font-weight: 600; }
  select {
    padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;
    background: #fff; font-size: 14px; font-family: inherit; color: #374151;
  }
  button.primary {
    margin-left: auto; padding: 10px 22px; font-size: 15px; font-weight: 600;
    color: #fff; background: #4f46e5; border: none; border-radius: 9px;
    cursor: pointer; transition: background .15s, transform .05s;
  }
  button.primary:hover:not(:disabled) { background: #4338ca; }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled { background: #a5b4fc; cursor: not-allowed; }

  /* 次要按钮：复制 / 填入示例。视觉上要明显比主按钮轻，
     否则用户会以为页面上有三个"生成"按钮。 */
  button.ghost {
    padding: 6px 12px; font-size: 13px; font-weight: 600; font-family: inherit;
    color: #4b5563; background: #fff; border: 1px solid #d1d5db;
    border-radius: 8px; cursor: pointer; transition: background .15s, color .15s;
  }
  button.ghost:hover:not(:disabled) { background: #f3f4f6; color: #111827; }
  button.ghost:disabled { opacity: .5; cursor: not-allowed; }
  #copy { margin-left: auto; }

  /* 纯文字按钮：塞在计数旁边，不占一排 */
  button.link {
    background: none; border: none; padding: 0; font: inherit;
    font-size: 13px; color: #4f46e5; cursor: pointer;
  }
  button.link:hover { text-decoration: underline; }

  .quota { font-size: 13px; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .quota.warn { color: #b45309; }
  /* 给额度那行留固定高度：没拿到时也不会有跳动 */
  .quota-line { text-align: right; margin: -4px 0 10px; min-height: 18px; }

  .out { margin-top: 20px; display: none; }
  .out.show { display: block; }
  .out-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 13px; color: #6b7280; flex-wrap: wrap;
  }
  .badge {
    background: #eef2ff; color: #4338ca; padding: 3px 9px; border-radius: 6px;
    font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .body {
    background: #fafafa; border: 1px solid #eee; border-radius: 10px;
    padding: 16px; font-size: 15px; white-space: pre-wrap; color: #1f2937;
  }
  .err { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .banner {
    display: none; margin-bottom: 14px; padding: 11px 14px; border-radius: 10px;
    font-size: 14px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
  }
  .banner.show { display: block; }
  footer { margin-top: 24px; font-size: 13px; color: #9ca3af; text-align: center; }
  footer a { color: #6b7280; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #10b981; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner"></div>

  <header>
    <h1>AI <span>摘要</span>服务</h1>
    <p class="sub">贴一段中文，返回几句话的要点。单次上限 5000 字。</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="k">累计生成</div><div class="v" id="s-total">—</div></div>
    <!-- 平均值只取最近 200 条样本，标题里就说清，别让人以为是全量平均 -->
    <div class="stat"><div class="k">近 200 次均耗时</div><div class="v" id="s-avg">—</div></div>
    <div class="stat" title="同样只统计最近 200 条记录"><div class="k">今日调用</div><div class="v" id="s-today">—</div></div>
  </div>

  <div class="quota-line"><span class="quota" id="quota"></span></div>

  <div class="card">
    <textarea id="text" aria-label="要摘要的正文" placeholder="把要摘要的正文粘在这里，例如一篇新闻报道、一段会议记录、一份论文摘要……"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 5000</span>
      <button class="link" id="sample" type="button" title="填一段示例正文，直接点生成就能看到效果">填入示例</button>
      <select id="len" aria-label="摘要句数">
        <option value="2">2 句话</option>
        <option value="3" selected>3 句话</option>
        <option value="5">5 句话</option>
      </select>
      <select id="engine" aria-label="用哪条链路生成" title="用哪条链路生成">
        <option value="own" selected>我的 Key</option>
        <option value="cloud">云服务</option>
      </select>
      <button class="primary" id="go">生成摘要</button>
    </div>
  </div>

  <div class="out" id="out">
    <div class="out-head">
      <span id="status" role="status"></span>
      <span class="badge" id="latency"></span>
      <span class="badge" id="model"></span>
      <button class="ghost" id="copy" type="button" hidden>复制</button>
    </div>
    <div class="body" id="body" aria-live="polite"></div>
  </div>

  <footer>
    <span class="dot"></span>默认走 Python 后端 + 我自己的百炼 Key（deepseek-v4.1-flash），可切到云服务大模型 · 调用记录存于云端数据库<br>
    接口文档见 <a href="/docs">/docs</a> · 健康检查 <a href="/api/health">/api/health</a> · Ctrl/⌘ + Enter 直接生成
  </footer>
</div>

<!-- 云服务 SDK（纯 HTML 项目用 CDN 形式，全局变量 WorkBuddyCloud）
     ★ 版本号必须写死，不能用 @dev / @latest：
       浮动标签会跟着上游发布自动变，某天一个 breaking change 推上来，
       页面第二天就白屏，而且你本地什么都没改、查半天查不出来。
       升级时手动改这个数字，改完自己点一遍。 -->
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@0.1.4/lib/index.global.js"></script>
<script>
/* ============================================================
 * 1) 云服务配置
 *    这四个值来自云服务开通时返回的 publicConfig，原样照抄，不要手改。
 *    publishableKey 本身不带任何权限，服务端会校验 Origin 是否匹配。
 * ============================================================ */
const PUBLIC_CONFIG = {
  endpoint: "https://ai-summary-svc.app.workbuddy.host",
  oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
  publishableKey: "wbpk_OCO14d6ljHR5OcR6J723m4_lLVUFsVKDiOV1MO4ATZsjM6fY3dNLKDB"
};

const MAX = 5000;
const $ = (id) => document.getElementById(id);

/* ============================================================
 * 超时与兜底
 *   以前完全没有超时：后端卡住 / 网络半死时，fetch 永远不返回，
 *   按钮一直是 disabled 的「生成中…」，用户只能刷新页面。
 *   own 链路是整段返回（后端内部最多重试 3 次，正常 1~3 秒），60 秒够了；
 *   云服务是流式，给 120 秒兜底。
 * ============================================================ */
const OWN_TIMEOUT_MS = 60000;
const STREAM_WATCHDOG_MS = 120000;

/* 示例正文：新用户打开是空框，不知道该贴什么，往往直接关掉。
   这段 280 字左右，按 maxReasonableSentences() 正好落在「3 句」档。 */
const SAMPLE_TEXT =
  "近日，工业和信息化部发布《关于加快推进人工智能产业创新发展的指导意见》，" +
  "提出到 2027 年建成一批人工智能创新应用先导区。意见明确，要支持大模型在制造、医疗、" +
  "教育等重点行业落地，鼓励企业与高校共建联合实验室，推动算力资源统筹调度和开放共享。" +
  "在数据要素方面，将探索建立高质量语料库分级分类管理制度，健全数据确权、流通和收益分配机制。" +
  "针对当前行业普遍反映的算力成本高、场景验证难等问题，意见提出设立专项资金、" +
  "建设公共服务平台等具体举措，并鼓励地方结合实际出台配套政策。" +
  "多位业内人士认为，此次文件更强调应用落地和生态协同，有望降低中小企业使用人工智能的门槛。";

let cloud = null;
let model = null;

/* ============================================================
 * 2) 初始化客户端（整个页面只建一次，所有模块共用）
 * ============================================================ */
function initCloud() {
  if (typeof WorkBuddyCloud === "undefined") {
    markCloudUnavailable();
    return false;
  }
  try {
    cloud = WorkBuddyCloud.createWorkBuddyCloud(PUBLIC_CONFIG);
    return true;
  } catch (e) {
    console.warn("云服务初始化失败", e);
    markCloudUnavailable();
    return false;
  }
}

/* 云服务 SDK 拿不到时，只把选项标灰——
 * 不要一进页面就弹黄色横幅：默认走「我的 Key」的人根本没用到云服务，
 * 那句"云服务加载失败"只会让他以为整个服务坏了。
 *
 * 换自定义域名后同一个函数还会被 refreshStats() 复用：
 * 云端只认白名单里的 Origin，新域名一律被拒，表现为 fetch 失败。
 */
function markCloudUnavailable(reason) {
  const opt = document.querySelector('#engine option[value="cloud"]');
  if (opt) {
    opt.disabled = true;
    opt.textContent = "云服务（暂不可用）";
    if (reason) opt.title = reason;
  }
  if ($("engine").value === "cloud") $("engine").value = "own";
}

function showBanner(msg) {
  const b = $("banner");
  b.textContent = msg;
  b.classList.add("show");
}

/* ============================================================
 * 3) 模型列表：优先用和「我的 Key」同款的 deepseek-v4.1-flash
 *
 *    ★ 为什么不能"取列表第一个"：平台把 auto 放在第一位，
 *      而 auto 是【深度思考】模型（只出推理、effort=high）。
 *      实测同一段文字：auto 首字节 15.5 秒 / 总 16.3 秒，
 *      deepseek-v4.1-flash 首字节 1.4 秒 / 总 1.7 秒——差 10 倍。
 *      摘要这种任务用不着深度思考，选贵的那档纯属浪费。
 * ============================================================ */
const PREFERRED_MODEL = "deepseek-v4.1-flash";

async function getModel() {
  if (model) return model;
  const models = await cloud.llm.models.list();
  if (!models || models.length === 0) {
    throw new Error("当前没有可用模型，请稍后再试");
  }
  const usable = models.filter((m) => m.disabled !== true);
  if (!usable.length) throw new Error("模型目录里没有可用的模型");

  // 找得到同款就用同款，找不到（平台调整了型号）就退回第一个可用的
  model = usable.find((m) => m.id === PREFERRED_MODEL) || usable[0];
  return model;
}

/* ============================================================
 * 4) 统计条：读云端数据库（公开只读）
 * ============================================================ */
async function refreshStats() {
  try {
    const { data, count, error } = await cloud.database
      .from("summary_stats")
      .select("input_chars, latency_ms, created_at", { count: "exact" })
      .order("created_at", { ascending: false })
      .limit(200);

    if (error) throw error;

    if (typeof count === "number") {
      $("s-total").textContent = count + " 篇";
    } else {
      $("s-total").textContent = (data ? data.length : 0) + " 篇";
    }

    const rows = data || [];
    if (rows.length) {
      const avg = rows.reduce((s, r) => s + (r.latency_ms || 0), 0) / rows.length;
      $("s-avg").textContent = Math.round(avg) + " ms";
    } else {
      $("s-avg").textContent = "—";
    }

    const today = new Date().toDateString();
    $("s-today").textContent =
      rows.filter((r) => r.created_at && new Date(r.created_at).toDateString() === today).length + " 次";
  } catch (e) {
    // 统计失败不影响主流程，不弹错误
    console.warn("统计读取失败", e);

    /* 但也不能当没发生：统计和云服务链路走同一个云端 endpoint、
       同一套 Origin 白名单。统计拉不到，通常意味着云服务链路也用不了
       （最常见的原因就是换了域名、没加白名单）。
       这里顺手把云服务选项标灰，比让用户点了「云服务」再撞一堵墙好。
       代价是临时网络抖动会误判一次——刷新页面就恢复了。 */
    markCloudUnavailable("当前域名不在云端白名单里，或云端暂时不可达");
  }
}

/* ============================================================
 * 5) 额度检查：仍然走 Python 后端（服务端限流比前端可靠）
 *    返回剩余次数，前端用来说"今天还剩 N 次"。
 * ============================================================ */
async function takeQuota() {
  const resp = await fetch("/api/quota/take", { method: "POST" });
  if (resp.ok) {
    let j = null;
    try {
      j = await resp.json();
    } catch (_) { /* 解析失败时当作"剩余未知"，不影响本次调用 */ }
    return j && typeof j.remaining === "number" ? j.remaining : -1;
  }
  let detail = "今天的额度已用完";
  try {
    const j = await resp.json();
    if (j && j.detail) detail = j.detail;
  } catch (_) { /* 忽略解析失败 */ }
  throw new Error(detail);
}

/* 把"今天还剩几次"显示出来。
   拿不到就别显示——宁可不显示，也不要摆一个猜出来的数字在那里。 */
function showQuota(remaining) {
  if (typeof remaining !== "number" || remaining < 0) return;
  const el = $("quota");
  el.textContent = "今日剩余 " + remaining + " 次";
  el.classList.toggle("warn", remaining <= 3);   // 快用完时变色提醒
}

/* ============================================================
 * 6) 自己那条链路：调 Python 后端的 /api/summarize
 *    后端用的是 .env 里配置的百炼 key（我自己的账户、自己的额度）。
 *    ★ 这里不再调 takeQuota()：/api/summarize 服务端内部已经记账一次，
 *      前端再调一次就是一次请求扣两次额度。
 * ============================================================ */
async function callOwnBackend(text, sentences) {
  /* 带超时的 fetch：AbortController 到点就掐断请求，
     否则网络半死时这个 await 永远不返回，界面就一直转圈。 */
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), OWN_TIMEOUT_MS);

  let resp;
  try {
    resp = await fetch("/api/summarize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, length: sentences }),
      signal: ctrl.signal
    });
  } catch (e) {
    // 主动 abort 时浏览器抛 AbortError，翻成人话；
    // 其余（断网、后端没起）统一归为"连不上"
    if (e && e.name === "AbortError") {
      throw new Error("等了 " + Math.round(OWN_TIMEOUT_MS / 1000) + " 秒还没返回，已自动放弃，请再点一次");
    }
    throw new Error("连不上后端（" + ((e && e.message) || "网络错误") + "）");
  } finally {
    clearTimeout(timer);
  }

  let data = null;
  try {
    data = await resp.json();
  } catch (_) { /* 后端 5xx 时可能是纯文本，解析失败就按空处理 */ }

  if (!resp.ok) {
    const detail = (data && data.detail) || ("HTTP " + resp.status);
    const err = new Error(detail);
    err.httpStatus = resp.status;    // 让 describeError 能按状态码说人话
    throw err;
  }
  if (!data || typeof data.summary !== "string") {
    throw new Error("后端返回格式不对（没拿到 summary 字段）");
  }
  return data;
}

/* ============================================================
 * 6.1) 统一写库：两条链路都记一笔元数据
 *      只存字数/耗时/模型名，不存正文也不存摘要内容。
 *      owner_id 一律不传（库里有 DEFAULT auth.uid()）。
 * ============================================================ */
async function recordStats(row) {
  if (!cloud) return;                // 云服务没起来也不能影响摘要本身
  try {
    const { error } = await cloud.database.from("summary_stats").insert(row);
    if (error) console.warn("记录写入失败", error);
  } catch (e) {
    console.warn("记录写入失败", e);
  }
}

/* ============================================================
 * 6.2) 流式调用一次，边收边渲染，返回完整文本
 *      抽出来是因为"句数不对要重写"会调第二次——不抽出来就得复制一遍循环。
 * ============================================================ */
async function streamOnce(modelId, system, userText, bodyEl, state) {
  let acc = "";
  const stream = cloud.llm.chat.completions.create({
    model: modelId,
    messages: [
      { role: "system", content: system },
      { role: "user", content: userText }
    ],
    stream: true,
    temperature: 0.3,
    stream_options: { include_usage: true }
  });

  for await (const chunk of stream) {
    // 上层已经放弃（看门狗超时 / 用户重新点了一次）：
    // 立刻停手，别再往页面上写——否则旧结果会把新的报错盖掉。
    if (state && state.cancelled) return acc;

    const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
    if (delta && delta.content) {
      acc += delta.content;
      bodyEl.textContent = acc;      // 边收边渲染
    }
  }
  return acc;
}

/* 数句子：中文的句子边界就是标点，和 main.py 里的 count_sentences 保持一致 */
function countSentences(s) {
  const m = (s || "").match(/[。！？!?]/g);
  return m ? m.length : 0;
}

/* 按字数给句数上限——和 main.py 的 max_reasonable_sentences() 必须一致。
 * 短文本硬凑 5 句会把一句劈成两句（"……气候干燥。冬季寒冷。"），读起来是残句。 */
function maxReasonableSentences(n) {
  if (n < 200) return 2;
  if (n < 600) return 3;
  if (n < 1500) return 4;
  return 5;
}

/* 规整排版垃圾——和 main.py 的 normalize_summary() 同一套规则：
 * 去掉行首列表符、丢掉空行、中文之间不塞空格、中文标点前后不留空格 */
function normalizeSummary(text) {
  if (!text) return "";
  const isCjk = (ch) => ch >= "\u4e00" && ch <= "\u9fff";

  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n")
    .split("\n")
    .map((l) => l.replace(/^\s*(?:[-*•·]|\d{1,2}[.)、])\s*/, "").trim())
    .filter((l) => l.length > 0);

  let joined = "";
  for (const line of lines) {
    if (!joined) joined = line;
    else if (isCjk(joined[joined.length - 1]) && isCjk(line[0])) joined += line;
    else joined += " " + line;
  }

  for (const ch of "。！？；：，、") {
    joined = joined.split(" " + ch).join(ch).split(ch + " ").join(ch);
  }
  return joined.replace(/[ \t]{2,}/g, " ").trim();
}

/* ============================================================
 * 6) 错误提示：按 error.code 前缀给不同的人话
 * ============================================================ */
function describeError(e) {
  const code = (e && e.error && e.error.code) || "";
  const msg = (e && e.error && e.error.message) || (e && e.message) || String(e);

  // 自有 Key 那条链路抛的是 HTTP 状态码，先按码说人话
  const hs = e && e.httpStatus;
  if (hs === 429) return "额度用完了：" + msg;
  if (hs === 503) return "后端没配好（多半是没设 API_KEY）：" + msg;
  if (hs === 502) return "上游模型服务不稳定，稍等再点一次：" + msg;
  if (hs === 422) return "请求格式不对（正文长度要在 1~5000 字）：" + msg;

  if (code.indexOf("auth_") === 0) return "云服务鉴权没通过（可能是当前域名不在白名单里）：" + code;
  if (code.indexOf("quota_") === 0) return "平台额度已用完或限流，稍后再试：" + code;
  if (code.indexOf("request_") === 0) return "请求参数或模型不匹配：" + msg;
  if (code.indexOf("gateway_") === 0 || code.indexOf("model_") === 0) return "模型服务暂时不可用，请点重试：" + code;
  if (code.indexOf("internal_") === 0) return "服务内部错误：" + (e.requestId ? "requestId " + e.requestId : msg);
  return msg;
}

/* ============================================================
 * 7) 主流程
 * ============================================================ */

/* 上一次生成的完整答案，给「复制」按钮用 */
let lastAnswer = "";
/* 请求序号：每点一次生成 +1。
   慢请求晚回来时靠它判断"我是不是已经被新的一次取代了"，
   否则旧结果会盖掉新结果——特别是流式，边收边写最明显。 */
let runSeq = 0;

async function doSummarize() {
  const ta = $("text");
  const text = ta.value.trim();
  const out = $("out"), body = $("body"), status = $("status");
  const btn = $("go");

  // 引擎：own = Python 后端（我自己的百炼 key）；cloud = 云服务大模型
  let engine = $("engine").value === "cloud" ? "cloud" : "own";

  if (!text) { alert("先贴点内容"); return; }
  if (text.length > MAX) { alert("超过 " + MAX + " 字了，删短一点"); return; }

  const mySeq = ++runSeq;
  const state = { cancelled: false };   // 看门狗用它告诉流式循环"别写了"

  btn.disabled = true;
  btn.textContent = "生成中…";
  out.classList.add("show");
  body.classList.remove("err");
  body.textContent = "";
  status.textContent = "生成中";
  $("latency").textContent = "";
  $("model").textContent = "";
  $("banner").classList.remove("show");
  $("copy").hidden = true;
  lastAnswer = "";

  // 云服务 SDK 没加载上（CDN 挂了、断网、企业网拦截）时自动回退，
  // 而不是把用户挡在门外——自有 Key 这条路不依赖任何外部脚本。
  if (engine === "cloud" && !cloud) {
    engine = "own";
    showBanner("云服务 SDK 没能加载，本次自动改用「我的 Key」链路。");
  }

  const sentences = [2, 3, 5].includes(parseInt($("len").value, 10))
    ? parseInt($("len").value, 10) : 3;
  const started = performance.now();

  let answer = "";
  let costMs = 0;
  let modelUsed = "";
  let usedSentences = sentences;      // 实际用了几句（短文本会被收窄）

  /* 看门狗：到点还没结束就把按钮放出来。
     云服务 SDK 的流式没有暴露 abort，底层请求不一定能真掐断，
     但至少用户不会被一个永远转圈的按钮困住；
     旧流程靠 state.cancelled / mySeq 自我沉默，不会污染新结果。 */
  const watchdog = setTimeout(() => {
    if (mySeq !== runSeq) return;
    state.cancelled = true;
    status.textContent = "超过 " + Math.round(STREAM_WATCHDOG_MS / 1000) + " 秒还没结束，已解除等待";
    btn.disabled = false;
    btn.textContent = "生成摘要";
  }, STREAM_WATCHDOG_MS);

  try {
    if (engine === "own") {
      /* ---------- 链路 A：Python 后端 + 我自己的 key ---------- */
      // 不走 takeQuota()：/api/summarize 服务端内部已经记一次额度
      const data = await callOwnBackend(text, sentences);
      if (mySeq !== runSeq) return;      // 已被新的一次请求取代，结果作废

      answer = data.summary;
      costMs = data.latency_ms;
      modelUsed = data.model || "未知模型";
      usedSentences = data.sentences_used || sentences;   // 后端会告诉我们实际用了几句
      body.textContent = answer;      // 这条链路是整段返回，没有流式
      showQuota(data.remaining);
    } else {
      /* ---------- 链路 B：云服务大模型（流式） ---------- */
      showQuota(await takeQuota());
      if (mySeq !== runSeq) return;

      const m = await getModel();
      modelUsed = m.id;

      // 和 main.py 的 max_reasonable_sentences() 保持同一套规则
      usedSentences = Math.min(sentences, maxReasonableSentences(text.length));

      // system 消息必须是应用自己写的固定内容，不能把用户输入拼进去
      const system =
        "你是一个简洁、准确的中文摘要助手。请写正好 " + usedSentences +
        " 句话概括用户给出的内容：每句话只讲一个要点，每句话都以句号结尾，" +
        "全文一共 " + usedSentences + " 个句号；不要合并句子，不要分点，" +
        "不要加标题，不要用 Markdown 列表。";

      answer = normalizeSummary(await streamOnce(m.id, system, text, body, state));
      if (mySeq !== runSeq) return;
      body.textContent = answer;    // 规整后再渲染，避免中间闪一下带列表符的版本

      // 提示词是"请求"不是"契约"：模型仍可能少写或把两句并成一句。
      // 句数不对就带纠正要求重写一次（只一次，避免积分翻倍）。
      if (countSentences(answer) !== usedSentences) {
        const got = countSentences(answer);
        status.textContent = "句数不足，正在补齐…";
        const fix =
          "你刚才写的不是 " + usedSentences + " 句（是 " + got + " 句）。" +
          "请重写：必须正好 " + usedSentences + " 句话，每句话以句号结尾，" +
          "只输出摘要正文，不要解释。";
        answer = normalizeSummary(await streamOnce(m.id, system, text + "\n\n" + fix, body, state));
        if (mySeq !== runSeq) return;
        body.textContent = answer;
      }
      costMs = Math.round(performance.now() - started);
    }

    if (!answer.trim()) {
      throw new Error("模型没有返回内容，请重试");
    }

    const base = engine === "own" ? "摘要结果 · 自有 Key" : "摘要结果 · 云服务";
    // 句数被收窄时要说清楚，否则用户会以为自己选的 4 句被无视了
    status.textContent = usedSentences === sentences
      ? base
      : base + "（原文 " + text.length + " 字，按 " + usedSentences + " 句给出）";
    $("latency").textContent = costMs + " ms · " + text.length + " 字";
    $("model").textContent = modelUsed;

    // 有结果了才亮出复制按钮
    lastAnswer = answer;
    $("copy").hidden = false;

    // 两条链路都记一笔到云端（只存元数据，不存正文与摘要内容）
    await recordStats({
      input_chars: text.length,
      output_chars: answer.length,
      latency_ms: costMs,
      model: modelUsed
    });
    await refreshStats();
  } catch (e) {
    if (mySeq !== runSeq) return;        // 过期请求的错误别干扰新请求
    body.classList.add("err");
    body.textContent = describeError(e);
    status.textContent = "出错了";
    $("latency").textContent = "";
    $("model").textContent = "";
  } finally {
    clearTimeout(watchdog);
    if (mySeq === runSeq) {              // 正常收尾；被取代的请求不许改按钮状态
      btn.disabled = false;
      btn.textContent = "生成摘要";
    }
  }
}

/* ============================================================
 * 7.1) 复制结果
 *   摘要页最高频的动作就是"复制走"，没有这个按钮，
 *   用户只能手动选中一长段文字。
 * ============================================================ */
async function copyAnswer() {
  if (!lastAnswer) return;
  const btn = $("copy");

  try {
    await navigator.clipboard.writeText(lastAnswer);
  } catch (_) {
    // 非 https 环境或老浏览器没有 clipboard API，退回老办法
    const tmp = document.createElement("textarea");
    tmp.value = lastAnswer;
    tmp.style.position = "fixed";
    tmp.style.opacity = "0";
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand("copy"); } catch (_) { /* 实在不行就算了 */ }
    document.body.removeChild(tmp);
  }

  btn.textContent = "已复制";
  setTimeout(() => { btn.textContent = "复制"; }, 1400);
}

/* ============================================================
 * 8) 事件绑定
 * ============================================================ */
$("text").addEventListener("input", () => {
  const n = $("text").value.length;
  $("count").textContent = n + " / " + MAX;
  $("count").classList.toggle("over", n > MAX);
});

$("go").addEventListener("click", doSummarize);

/* Ctrl / ⌘ + Enter 直接生成：
   贴完长文手还在键盘上，不用再去够鼠标。生成中就别重复触发。 */
$("text").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    if (!$("go").disabled) doSummarize();
  }
});

/* 填入示例：顺手派发 input 事件，字数计数才会跟着变；
   否则用户会看到"填了字但计数还是 0 / 5000"。 */
$("sample").addEventListener("click", () => {
  const ta = $("text");
  ta.value = SAMPLE_TEXT;
  ta.dispatchEvent(new Event("input"));
  ta.focus();
});

$("copy").addEventListener("click", copyAnswer);

// 页面就绪后初始化并拉一次统计
if (initCloud()) {
  refreshStats();
}
</script>
</body>
</html>
