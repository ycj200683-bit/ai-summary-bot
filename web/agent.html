<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 文档 Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1a1a1a; line-height: 1.6;
    min-height: 100vh; padding: 28px 16px 56px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; }
  h1 span { color: #4f46e5; }
  .sub { color: #6b7280; font-size: 14px; margin-top: 5px; }
  .back { font-size: 13px; color: #4f46e5; text-decoration: none; }
  .back:hover { text-decoration: underline; }

  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 14px; font-weight: 600; color: #6b7280;
    letter-spacing: .3px; margin-bottom: 12px;
  }

  textarea {
    width: 100%; min-height: 92px; padding: 13px; font-size: 15px;
    font-family: inherit; line-height: 1.7; color: #111827;
    border: 1px solid #d1d5db; border-radius: 10px; resize: vertical;
    outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    padding: 5px 11px; font-size: 12.5px; font-family: inherit; color: #4b5563;
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 999px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .chip:hover { background: #f3f4f6; border-color: #d1d5db; }

  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .count { font-size: 13px; color: #9ca3af; font-variant-numeric: tabular-nums; }
  select {
    padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;
    background: #fff; font-size: 14px; font-family: inherit; color: #374151;
  }
  label.inline { font-size: 13px; color: #6b7280; }

  button.primary {
    margin-left: auto; padding: 10px 22px; font-size: 15px; font-weight: 600;
    color: #fff; background: #4f46e5; border: none; border-radius: 9px;
    cursor: pointer; transition: background .15s, transform .05s;
  }
  button.primary:hover:not(:disabled) { background: #4338ca; }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled { background: #a5b4fc; cursor: not-allowed; }

  .meta { font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
  .meta b { color: #4b5563; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- trace 时间线 ---- */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px;
    width: 2px; background: #e5e7eb;
  }
  .step { position: relative; margin-bottom: 14px; }
  .step:last-child { margin-bottom: 0; }
  .step::before {
    content: attr(data-n); position: absolute; left: -26px; top: 0;
    width: 18px; height: 18px; border-radius: 50%;
    background: #4f46e5; color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step.fail::before { background: #dc2626; }
  .step-body {
    background: #f9fafb; border: 1px solid #eef0f3; border-radius: 10px;
    padding: 10px 12px;
  }
  .step-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tool-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 600; color: #4338ca;
    background: #eef2ff; padding: 1px 8px; border-radius: 6px;
  }
  .time { font-size: 12px; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .badge {
    font-size: 11.5px; padding: 1px 7px; border-radius: 5px; font-weight: 600;
  }
  .badge.ok { background: #ecfdf5; color: #047857; }
  .badge.bad { background: #fef2f2; color: #b91c1c; }
  .args {
    margin-top: 7px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; color: #4b5563; white-space: pre-wrap; word-break: break-all;
  }
  /* 工具返回值：用绿色区分"输入"和"输出"，扫一眼就知道这步产出了什么 */
  .result {
    margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e5e7eb;
    font-size: 12.5px; color: #065f46; word-break: break-all;
  }
  .result-label { font-weight: 600; margin-right: 6px; color: #047857; }
  .result-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .err { margin-top: 6px; font-size: 12.5px; color: #b91c1c; }

  /* ---- 结果 ---- */
  .answer { font-size: 15px; line-height: 1.8; white-space: pre-wrap; color: #111827; }
  .empty { color: #9ca3af; font-size: 14px; }
  .alert {
    background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
  }
  .alert.hidden { display: none; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%;
    animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 文档 <span>Agent</span></h1>
    <p class="sub">给一句指令，模型自己决定调哪些工具、调几次。下面是它真实走过的每一步。</p>
    <p style="margin-top:6px"><a class="back" href="/">← 回到摘要工具</a></p>
  </header>

  <div id="alert" class="alert hidden"></div>

  <div class="card">
    <h2>你要它做什么</h2>
    <textarea id="query" placeholder="例如：帮我读 sample.txt，统计字数并摘要成 3 句"></textarea>
    <div class="chips" id="chips">
      <button class="chip">统计这句话有多少字，关键词是什么：人工智能 正在改变 软件开发</button>
      <button class="chip">帮我读 sample.txt，统计字数并摘要成 3 句</button>
      <button class="chip">读 sample.txt，提取 5 个关键词</button>
    </div>
    <div class="row">
      <span class="count" id="charcount">0 / 1000</span>
      <label class="inline" for="maxsteps">最大步数</label>
      <select id="maxsteps">
        <option value="4">4 步（最快）</option>
        <option value="6" selected>6 步（推荐）</option>
        <option value="10">10 步（复杂任务）</option>
      </select>
      <button class="primary" id="run">开始执行</button>
    </div>
  </div>

  <div class="card" id="result-card">
    <h2>执行轨迹</h2>
    <div class="meta" id="meta"></div>
    <div id="trace"><p class="empty">还没有执行记录。</p></div>
  </div>

  <div class="card">
    <h2>最终回答</h2>
    <div id="answer" class="answer empty">等待执行……</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const queryEl = $("query");
  const runBtn = $("run");
  const traceEl = $("trace");
  const answerEl = $("answer");
  const metaEl = $("meta");
  const alertEl = $("alert");

  // 字数计数 + 超限变红
  function updateCount() {
    const n = queryEl.value.length;
    const el = $("charcount");
    el.textContent = n + " / 1000";
    el.classList.toggle("over", n > 1000);
  }
  queryEl.addEventListener("input", updateCount);
  updateCount();

  // 示例一键填入
  $("chips").addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) {
      queryEl.value = e.target.textContent.trim();
      updateCount();
    }
  });

  // ⚠️ 所有来自模型的文本必须走 textContent，不能用 innerHTML。
  //   工具参数、模型回答都是"外部输入"，直接拼 HTML 就是 XSS 的口子。
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderTrace(trace) {
    traceEl.innerHTML = "";
    if (!trace || trace.length === 0) {
      traceEl.appendChild(el("p", "empty", "这次没有调用任何工具，模型直接回答了。"));
      return;
    }
    const line = el("div", "timeline");
    trace.forEach((s) => {
      const item = el("div", "step" + (s.ok ? "" : " fail"));
      item.setAttribute("data-n", String(s.step));

      const body = el("div", "step-body");
      const head = el("div", "step-head");
      head.appendChild(el("span", "tool-name", s.tool));
      head.appendChild(el("span", "badge " + (s.ok ? "ok" : "bad"), s.ok ? "成功" : "失败"));
      if (s.elapsed_ms !== null && s.elapsed_ms !== undefined) {
        head.appendChild(el("span", "time", s.elapsed_ms + " ms"));
      }
      body.appendChild(head);

      // 参数用 JSON 展示：让用户看见"模型到底传了什么"，
      // 这是 Agent 可解释性最直观的一层。
      const args = JSON.stringify(s.args || {}, null, 0);
      body.appendChild(el("div", "args", args.length > 220 ? args.slice(0, 220) + " …" : args));

      // 工具结果预览：只有参数没有返回值，看的人不知道"它算出了什么"。
      if (s.ok && s.result) {
        const res = el("div", "result");
        res.appendChild(el("span", "result-label", "→ 返回"));
        res.appendChild(el("span", "result-text", s.result));
        body.appendChild(res);
      }
      if (!s.ok && s.error) body.appendChild(el("div", "err", s.error));

      item.appendChild(body);
      line.appendChild(item);
    });
    traceEl.appendChild(line);
  }

  function showAlert(msg) {
    alertEl.textContent = msg;
    alertEl.classList.remove("hidden");
  }
  function clearAlert() {
    alertEl.classList.add("hidden");
    alertEl.textContent = "";
  }

  async function run() {
    const query = queryEl.value.trim();
    if (!query) {
      showAlert("先写一句指令再执行。");
      return;
    }
    if (query.length > 1000) {
      showAlert("指令太长了，最多 1000 字。");
      return;
    }

    clearAlert();
    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="spinner"></span>执行中…';
    answerEl.textContent = "模型正在思考并调用工具……（通常 5-20 秒）";
    answerEl.className = "answer";
    metaEl.textContent = "";
    traceEl.innerHTML = '<p class="empty">等待模型第一步……</p>';

    const started = performance.now();
    try {
      const resp = await fetch("/api/agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query, max_steps: parseInt($("maxsteps").value, 10) }),
      });

      const data = await resp.json().catch(() => ({}));

      if (!resp.ok) {
        // FastAPI 的错误在 detail 里，可能是字符串也可能是数组（校验错误）
        let msg = data && data.detail;
        if (Array.isArray(msg)) msg = msg.map((d) => d.msg).join("；");
        showAlert("执行失败（" + resp.status + "）：" + (msg || "未知错误"));
        answerEl.textContent = "本次没有结果。";
        answerEl.className = "answer empty";
        traceEl.innerHTML = '<p class="empty">未产生执行记录。</p>';
        return;
      }

      renderTrace(data.trace);
      answerEl.textContent = data.answer || "（模型没有返回文本）";
      answerEl.className = "answer";

      const total = Math.round(performance.now() - started);
      const parts = [
        "模型 " + data.model,
        "共 " + data.steps + " 步",
        "服务端耗时 " + data.elapsed_ms + " ms",
        "端到端 " + total + " ms",
      ];
      if (data.remaining >= 0) parts.push("今日剩余 " + data.remaining + " 次");
      metaEl.textContent = parts.join(" ｜ ");

      if (data.hit_max_steps) {
        showAlert("触发了最大步数保护：模型想继续调工具，但被安全闸挡住。可以调大最大步数或把任务描述得更具体。");
      }
    } catch (e) {
      showAlert("网络或服务异常：" + e.message);
      answerEl.textContent = "本次没有结果。";
      answerEl.className = "answer empty";
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "开始执行";
    }
  }

  runBtn.addEventListener("click", run);
  // Ctrl/Cmd + Enter 快捷执行
  queryEl.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
  });
})();
</script>
</body>
</html>
